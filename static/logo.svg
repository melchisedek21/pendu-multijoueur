<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Logo UnderPendu">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16123f"/>
      <stop offset="1" stop-color="#050b1b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.66" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7c3cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c3cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a97bff"/>
      <stop offset="1" stop-color="#6a2cf0"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#fond)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#halo)"/>
  <rect x="5.5" y="5.5" width="245" height="245" rx="54.5" fill="none" stroke="#8c5cff" stroke-opacity=".45" stroke-width="3"/>

  <!-- Potence -->
  <g stroke="#e6edff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M46 212 H132"/>
    <path d="M76 212 V48 H172"/>
    <path d="M76 90 L118 48"/>
  </g>
  <!-- Corde -->
  <path d="M172 48 V70" stroke="#e6edff" stroke-width="6" stroke-linecap="round"/>

  <!-- Corps de l'espion (manteau) -->
  <path d="M146 196 L152 150 Q172 138 192 150 L198 196 Z" fill="url(#violet)"/>
  <path d="M172 146 L162 176 M172 146 L182 176" stroke="#050b1b" stroke-width="4" stroke-linecap="round" opacity=".55"/>

  <!-- Tete -->
