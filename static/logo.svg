  <!-- Masque (loup) -->
  <path d="M146 112 Q172 100 198 112 L196 126 Q185 131 177 124 Q172 121 167 124 Q159 131 148 126 Z" fill="#050b1b"/>
  <ellipse cx="160" cy="117" rx="5.5" ry="3.6" fill="#20d98a"/>
  <ellipse cx="184" cy="117" rx="5.5" ry="3.6" fill="#20d98a"/>

  <!-- Chapeau (fedora) -->
  <path d="M152 96 Q150 72 162 70 Q172 76 182 70 Q194 72 192 96 Z" fill="#050b1b"/>
  <path d="M153 90 H191" stroke="#8c5cff" stroke-width="5"/>
  <ellipse cx="172" cy="97" rx="36" ry="7.5" fill="#050b1b"/>
